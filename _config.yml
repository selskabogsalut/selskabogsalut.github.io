# Selskab & Salut – indstillinger for sitet
# Efter ændringer i denne fil skal GitHub Pages bygge sitet igen (sker automatisk ved push).

title: Selskab & Salut
tagline: Eventbureau specialiseret i Smålandsfarvandet
description: >-
  Selskab & Salut er et eventbureau specialiseret i Smålandsfarvandet. Vi holder
  selskaber på øerne i farvandet, også på private øer. Her finder du spisesteder,
  catering, leverandører og sejltider.
url: "https://selskabogsalut.github.io"
baseurl: ""
lang: da
locale: da_DK

# Vises i sidefoden. Adressen er opdigtet.
adresse: "Havnevej 4, Kobberø"

# Note i sidefoden på alle sider. Sæt til "" for at skjule den.
# Anbefales, så længe sitet er offentligt og kan findes via søgemaskiner.
fiktion: "Selskab & Salut og øerne Kobberø, Lyngø, Ravneholm og Sælholm er opdigtede. Alle navne, priser og tider på sitet er fiktive."

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Hver samling bliver til en mappe med én side pr. fil, fx /spisesteder/pakhuset/
collections:
  spisesteder:
    output: true
    permalink: /spisesteder/:name/
  catering:
    output: true
    permalink: /catering/:name/
  leverandoerer:
    output: true
    permalink: /leverandoerer/:name/
  transport:
    output: true
    permalink: /transport/:name/
  arkiv:
    output: true
    permalink: /arkiv/:name/
  # Fildeling (intern)
  fildeling:
    output: true
    permalink: /fildeling/:name/

defaults:
  # Datoen for seneste ændring vises i sitemap.xml (lastmod), som søgemaskiner bruger til at
  # vælge, hvad de skal hente igen. Ret datoen her, når mange sider ændres, eller sæt
  # last_modified_at i den enkelte sides front matter, når kun den side ændres.
  - scope:
      path: ""
    values:
      layout: side
      last_modified_at: 2026-11-11
  - scope:
      path: ""
      type: spisesteder
    values:
      layout: emne
      date: "2026-11-10"
      last_modified_at: 2026-11-11
      seo:
        type: WebPage
  - scope:
      path: ""
      type: catering
    values:
      layout: emne
      date: "2026-11-10"
      last_modified_at: 2026-11-11
      seo:
        type: WebPage
  - scope:
      path: ""
      type: leverandoerer
    values:
      layout: emne
      date: "2026-11-10"
      last_modified_at: 2026-11-11
      seo:
        type: WebPage
  - scope:
      path: ""
      type: transport
    values:
      layout: emne
      date: "2026-11-10"
      last_modified_at: 2026-11-11
      seo:
        type: WebPage
  - scope:
      path: ""
      type: arkiv
    values:
      layout: emne
      date: "2026-11-10"
      last_modified_at: 2026-11-11
      seo:
        type: WebPage
  # Fildeling (intern)
  - scope:
      path: ""
      type: fildeling
    values:
      layout: emne
      date: "2026-11-11"
      last_modified_at: 2026-11-11
      seo:
        type: WebPage

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - tools
  - vendor
  - .bundle
  - .jekyll-cache
