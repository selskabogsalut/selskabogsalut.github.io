# Afsnittene i kataloget. Rækkefølgen her styrer menuen, forsiden, sidefoden og oversigten.
#   samling:    navnet på samlingen i _config.yml (og mappen _<samling>/)
#   titel:      vises i menuen og som overskrift
#   ental:      bruges i "Forrige spisested" / "Næste spisested"
#   url:        adressen på afsnittets oversigtsside (skal matche permalink i afsnittets .md-fil)
#   sortering:  feltet, siderne sorteres efter (title = sidens navn)
#   omvendt:    true = nyeste/største først
#   visning:    dokument = brødteksten vises som et dokument med serif-skrift (bruges af fildelingen)
#   beskrivelse: kort tekst til kataloget på forsiden

- samling: spisesteder
  titel: Spisesteder
  ental: spisested
  url: /spisesteder/
  sortering: title
  beskrivelse: Steder at holde selskab på øerne, med kapacitet og leje

- samling: catering
  titel: Catering
  ental: menu
  url: /catering/
  sortering: title
  beskrivelse: Menuer med priser pr. person, allergener og de øer, køkkenet leverer til

- samling: leverandoerer
  titel: Leverandører
  ental: leverandør
  url: /leverandoerer/
  sortering: title
  beskrivelse: Vin, blomster, musik, strøm og udlejning med prislister

- samling: transport
  titel: Transport
  ental: rute
  url: /transport/
  sortering: title
  beskrivelse: Færger, charterbåd og taxabåd med tider og priser

- samling: arkiv
  titel: Arkiv
  ental: arrangement
  url: /arkiv/
  sortering: dato
  omvendt: true
  beskrivelse: Tidligere arrangementer med gæster, sted og pris

# Fildeling (intern)
- samling: fildeling
  titel: Fildeling (intern)
  ental: fil
  url: /fildeling/
  sortering: dato
  omvendt: true
  visning: dokument
  beskrivelse: Avisudklip, mails og andre kilder med dato og afsender
