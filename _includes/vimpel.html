{%- comment -%}

  Snoren er kurven M0 20 Q500 140 1000 20; flagene sidder på kurven og følger dens hældning.
{%- endcomment -%}

  <g class="f1" transform="translate(180 55.4) rotate(8.7)"><g class="sving">
    <use href="#flag-s" x="-55" y="0" width="110" height="76"/>
    <circle cx="-49" cy="0" r="3.5" fill="currentColor"/><circle cx="49" cy="0" r="3.5" fill="currentColor"/>
  </g></g>
  <g class="f2" transform="translate(340 73.9) rotate(4.4)"><g class="sving">

  </g></g>
  <g class="f3" transform="translate(500 80)"><g class="sving">
    <use href="#flag-l" x="-55" y="0" width="110" height="76"/>
    <circle cx="-49" cy="0" r="3.5" fill="currentColor"/><circle cx="49" cy="0" r="3.5" fill="currentColor"/>
